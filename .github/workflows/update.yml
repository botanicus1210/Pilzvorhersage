# .github/workflows/update.yml
# - schedule (taeglich):   Wetter + Funde neu rechnen, Schutzgebiete vom Live-Stand uebernehmen
# - push (Code-Aenderung): NUR neu ausliefern, alle Daten vom Live-Stand uebernehmen (schnell)
# - workflow_dispatch:     alles komplett neu bauen
name: Pilzkarte aktualisieren

on:
  schedule:
    - cron: "0 6 * * *"      # taeglich 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      LIVE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vorhandene Daten vom Live-Stand uebernehmen
        run: |
          mkdir -p site
          for f in pilzwachstum.geojson funde.geojson schutzgebiete.geojson; do
            curl -fsSL "$LIVE/$f" -o "site/$f" && echo "uebernommen: $f" || echo "nicht vorhanden: $f"
          done

      - name: Daten erzeugen (INCA + AROME -> GeoJSON)
        if: github.event_name != 'push'
        env:
          PILZ_OUTPUT: site/pilzwachstum.geojson
          PILZ_MASK: pilz_forest_mask.json
        run: python pilzwachstum.py --run

      - name: Fundmeldungen holen (iNaturalist)
        if: github.event_name != 'push'
        env:
          PILZ_FUNDE: site/funde.geojson
        continue-on-error: true
        run: python funde.py --run

      - name: Schutzgebiete holen (nur manuell oder wenn fehlend)
        env:
          PILZ_SCHUTZ: site/schutzgebiete.geojson
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -s site/schutzgebiete.geojson ]; then
            pip install osm2geojson
            python schutzgebiete.py --run
          else
            echo "Schutzgebiete vom Live-Stand uebernommen"
          fi

      - name: Inhalt pruefen
        run: ls -lh site/

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Webordner als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages veroeffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
